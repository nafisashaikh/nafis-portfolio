<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1220"/>
      <stop offset="1" stop-color="#080a10"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#97acff"/>
      <stop offset="1" stop-color="#6be4ed"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#7792ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7792ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7792ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#6be4ed" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- brand -->
  <g transform="translate(80 72)">
    <rect width="52" height="52" rx="14" fill="#0f1626" stroke="#7792ff" stroke-opacity="0.4"/>
    <text x="26" y="27" text-anchor="middle" dominant-baseline="central" font-family="'Sora',sans-serif" font-weight="700" font-size="22" letter-spacing="-1" fill="url(#brand)">NS</text>
    <text x="70" y="26" dominant-baseline="central" font-family="'Sora',sans-serif" font-weight="600" font-size="22" fill="#f5f7fb">Nafis Shaikh</text>
  </g>

  <!-- headline -->
  <text x="80" y="300" font-family="'Sora','Segoe UI',sans-serif" font-weight="600" font-size="76" letter-spacing="-2" fill="#f5f7fb">Turning complex data</text>
  <text x="80" y="388" font-family="'Sora','Segoe UI',sans-serif" font-weight="600" font-size="76" letter-spacing="-2" fill="#f5f7fb">into clear decisions.</text>

  <text x="82" y="452" font-family="'JetBrains Mono',monospace" font-size="22" letter-spacing="1" fill="#a6b0c0">Data Analytics · Business Intelligence · AI</text>

  <!-- abstract data motif -->
  <g transform="translate(880 150)" opacity="0.9">
    <ellipse cx="130" cy="130" rx="150" ry="54" fill="none" stroke="#7792ff" stroke-opacity="0.3" transform="rotate(-18 130 130)"/>
    <circle cx="130" cy="130" r="92" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/>
    <g transform="translate(86 92)">
      <rect x="0"  y="40" width="14" height="48" rx="3" fill="url(#bar)"/>
      <rect x="22" y="20" width="14" height="68" rx="3" fill="url(#bar)"/>
      <rect x="44" y="52" width="14" height="36" rx="3" fill="url(#bar)"/>
      <rect x="66" y="8"  width="14" height="80" rx="3" fill="url(#bar)"/>
    </g>
    <circle cx="130" cy="130" r="6" fill="#6be4ed"/>
  </g>
</svg>
